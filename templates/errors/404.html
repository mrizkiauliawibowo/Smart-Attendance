<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>404 - Halaman Tidak Ditemukan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: #e2e8f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .error-code { font-size: 8rem; font-weight: 700; background: linear-gradient(135deg, #6366f1, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; }
        .error-card { background: #1e293b; border: 1px solid #334155; border-radius: 1.5rem; padding: 3rem; text-align: center; max-width: 480px; }
        .btn-home { background: linear-gradient(135deg, #6366f1, #8b5cf6); border: none; border-radius: 2rem; padding: 0.75rem 2rem; color: white; font-weight: 600; text-decoration: none; display: inline-block; transition: transform 0.2s, box-shadow 0.2s; }
        .btn-home:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(99,102,241,0.4); color: white; }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-code">404</div>
        <h2 class="mt-3 fw-semibold">Halaman Tidak Ditemukan</h2>
        <p class="text-muted mt-2">Endpoint yang kamu akses tidak tersedia di aplikasi ini.</p>
        <a href="/" class="btn-home mt-4">
            <i class="bi bi-house-fill me-2"></i>Kembali ke Dashboard
        </a>
    </div>
</body>
</html>
